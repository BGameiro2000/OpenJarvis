name: unraid-image

# Builds the Unraid images from deploy/unraid/ (see deploy/unraid/README.md).
# OpenJarvis: upstream deploy/docker/Dockerfile at the pinned commit -> base
# image, then deploy/unraid/Dockerfile FROM that base. Cognee: thin layer over
# the pinned official cognee/cognee tag. Pins live in deploy/unraid/versions.env.
#
# Images are pushed to GHCR only from main or a manual run. Other branches
# build and smoke test without pushing.

on:
  workflow_dispatch:
    inputs:
      push:
        description: "Push images to GHCR"
        type: boolean
        default: true
  push:
    paths:
      - "deploy/unraid/**"
      - ".github/workflows/unraid-image.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: unraid-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  OWNER: bgameiro2000

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # The Cognee base image is about 6 GB; make room on the runner first.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Checkout packaging (this commit)
        uses: actions/checkout@v4
        with:
          path: packaging

      - name: Read pins
        id: pins
        run: |
          set -euo pipefail
          grep -E '^[A-Z_]+=' packaging/deploy/unraid/versions.env >> "$GITHUB_OUTPUT"
          . packaging/deploy/unraid/versions.env
          short="${OPENJARVIS_COMMIT:0:7}"
          echo "short=$short" >> "$GITHUB_OUTPUT"
          echo "human=${OPENJARVIS_VERSION}-${short}-u${UNRAID_LAYER_VERSION}" >> "$GITHUB_OUTPUT"
          echo "cognee_human=${COGNEE_VERSION}-u${COGNEE_LAYER_VERSION}" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "push=${{ inputs.push }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout OpenJarvis at the pinned commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pins.outputs.OPENJARVIS_COMMIT }}
          path: src

      - name: Overlay deploy/unraid from this commit
        run: |
          rm -rf src/deploy/unraid
          cp -a packaging/deploy/unraid src/deploy/unraid

      - name: Apply build-time patches to upstream files
        run: sh src/deploy/unraid/patches/apply.sh src

      # The "docker" driver lets the second build use the locally loaded base.
      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Log in to GHCR
        if: steps.pins.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build base image (upstream Dockerfile plus patches/)
        uses: docker/build-push-action@v6
        with:
          context: src
          file: src/deploy/docker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: openjarvis-base:${{ steps.pins.outputs.short }}

      - name: Build Unraid image
        uses: docker/build-push-action@v6
        with:
          context: src
          file: src/deploy/unraid/Dockerfile
          platforms: linux/amd64
          load: true
          build-args: |
            BASE_IMAGE=openjarvis-base:${{ steps.pins.outputs.short }}
            OPENJARVIS_COMMIT=${{ steps.pins.outputs.OPENJARVIS_COMMIT }}
            OPENJARVIS_VERSION=${{ steps.pins.outputs.OPENJARVIS_VERSION }}
            UNRAID_LAYER_VERSION=${{ steps.pins.outputs.UNRAID_LAYER_VERSION }}
          tags: openjarvis-unraid:test

      - name: Build Cognee image
        uses: docker/build-push-action@v6
        with:
          context: src/deploy/unraid/cognee
          platforms: linux/amd64
          load: true
          build-args: |
            COGNEE_VERSION=${{ steps.pins.outputs.COGNEE_VERSION }}
            COGNEE_LAYER_VERSION=${{ steps.pins.outputs.COGNEE_LAYER_VERSION }}
          tags: cognee-unraid:test

      - name: Image sizes
        run: |
          docker image ls --format '{{.Repository}}:{{.Tag}} {{.Size}}' | grep -E 'openjarvis-(base|unraid)|cognee-unraid'
          df -h /

      # Both containers together, no real key: auth, UID 99, capabilities,
      # keyless ingest and recall on three linked notes, Cognee down,
      # docker kill, persistence. See deploy/unraid/tests/wiring.sh.
      - name: Wiring tests
        run: bash src/deploy/unraid/tests/wiring.sh openjarvis-unraid:test cognee-unraid:test "$RUNNER_TEMP/wiring"

      - name: Push
        if: steps.pins.outputs.push == 'true'
        run: |
          set -euo pipefail
          img=${{ env.REGISTRY }}/${{ env.OWNER }}/openjarvis-unraid
          base=${{ env.REGISTRY }}/${{ env.OWNER }}/openjarvis-base
          cg=${{ env.REGISTRY }}/${{ env.OWNER }}/cognee-unraid
          for t in "${{ steps.pins.outputs.OPENJARVIS_COMMIT }}" "${{ steps.pins.outputs.short }}"; do
            docker tag openjarvis-base:${{ steps.pins.outputs.short }} "$base:$t"; docker push "$base:$t"
          done
          for t in "${{ steps.pins.outputs.human }}" "sha-${GITHUB_SHA:0:7}"; do
            docker tag openjarvis-unraid:test "$img:$t"; docker push "$img:$t"
          done
          for t in "${{ steps.pins.outputs.cognee_human }}" "sha-${GITHUB_SHA:0:7}"; do
            docker tag cognee-unraid:test "$cg:$t"; docker push "$cg:$t"
          done
          echo "Pushed $img:${{ steps.pins.outputs.human }} and $cg:${{ steps.pins.outputs.cognee_human }}" >> "$GITHUB_STEP_SUMMARY"

  # Machine HUD (deploy/unraid/hud/). Small and independent of the other two
  # images, so it runs as its own job.
  hud:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read pins
        id: pins
        run: |
          set -euo pipefail
          grep -E '^[A-Z_]+=' deploy/unraid/versions.env >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "push=${{ inputs.push }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Backend tests
        working-directory: deploy/unraid/hud/backend
        run: |
          python3 -m venv /tmp/hudvenv
          /tmp/hudvenv/bin/pip install -q -r requirements.txt pytest==8.3.4 playwright==1.55.0
          /tmp/hudvenv/bin/python -m pytest -q

      # The HUD backend against the real floor, intake and council routers.
      - name: Checkout the custom package (home-jarvis)
        uses: actions/checkout@v4
        with:
          ref: home-jarvis
          path: hj

      - name: Contract test with the custom package
        run: |
          PYTHONPATH=src HOME_JARVIS_SRC=hj/home-jarvis \
            /tmp/hudvenv/bin/python -m pytest -q -p no:cacheprovider deploy/unraid/hud/tests/contract_test.py

      - name: Build HUD image
        uses: docker/build-push-action@v6
        with:
          context: deploy/unraid/hud
          platforms: linux/amd64
          load: true
          build-args: |
            HUD_NODE_IMAGE=${{ steps.pins.outputs.HUD_NODE_IMAGE }}
            HUD_PYTHON_IMAGE=${{ steps.pins.outputs.HUD_PYTHON_IMAGE }}
            HUD_VERSION=${{ steps.pins.outputs.HUD_VERSION }}
          tags: machine-hud:test

      - name: Container smoke test
        run: bash deploy/unraid/hud/tests/container.sh machine-hud:test "$RUNNER_TEMP/hud"

      - name: Browser smoke test (demo mode)
        run: |
          set -euo pipefail
          /tmp/hudvenv/bin/python -m playwright install --with-deps chromium >/dev/null
          docker run -d --name hud-ui -p 127.0.0.1:18081:8080 --user 99:100 --cap-drop=ALL \
            --read-only --tmpfs /tmp:size=16m -e HUD_DEMO=1 machine-hud:test
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:18081/healthz >/dev/null 2>&1 && break; sleep 1; done
          /tmp/hudvenv/bin/python deploy/unraid/hud/tests/ui_smoke.py http://127.0.0.1:18081 "$RUNNER_TEMP/shots"
          docker rm -f hud-ui

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hud-screenshots
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore

      - name: Log in to GHCR
        if: steps.pins.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: steps.pins.outputs.push == 'true'
        run: |
          set -euo pipefail
          img=${{ env.REGISTRY }}/${{ env.OWNER }}/machine-hud
          for t in "${{ steps.pins.outputs.HUD_VERSION }}" "sha-${GITHUB_SHA:0:7}"; do
            docker tag machine-hud:test "$img:$t"; docker push "$img:$t"
          done
          echo "Pushed $img:${{ steps.pins.outputs.HUD_VERSION }}" >> "$GITHUB_STEP_SUMMARY"
